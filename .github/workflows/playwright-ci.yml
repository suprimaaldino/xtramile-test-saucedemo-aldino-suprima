name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    env:
      CI: true
      HOME: /root
      SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
      SAUCE_STANDARD_PASS: ${{ secrets.SAUCE_STANDARD_PASS }}
      SAUCE_LOCKED_OUT_USER: ${{ secrets.SAUCE_LOCKED_OUT_USER }}
      SAUCE_LOCKED_OUT_PASS: ${{ secrets.SAUCE_LOCKED_OUT_PASS }}
      SAUCE_INVALID_USER: ${{ secrets.SAUCE_INVALID_USER }}
      SAUCE_INVALID_PASS: ${{ secrets.SAUCE_INVALID_PASS }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER }}
      SAUCE_PROBLEM_PASS: ${{ secrets.SAUCE_PROBLEM_PASS }}
      BASE_URL: https://www.saucedemo.com

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify environment variables
        run: |
          echo "SAUCE_STANDARD_USER length: ${#SAUCE_STANDARD_USER}"
          echo "SAUCE_STANDARD_PASS length: ${#SAUCE_STANDARD_PASS}"

      - name: Run Playwright Tests
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Debug Allure Results
        if: always()
        run: |
          echo "=== Shard ${{ matrix.shard }} Allure results ==="
          find allure-results -type f 2>/dev/null | head -20 || true
          echo "Total files:"
          find allure-results -type f 2>/dev/null | wc -l

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: error